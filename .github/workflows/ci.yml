name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PARALLEL_LIMIT: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Repository validation
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/verify_repository.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Source formatting
        run: |
          mvn -B -ntp spotless:check
          python3 scripts/go_tasks.py format-check
      - name: Java unit and PostgreSQL integration tests
        run: |
          mkdir -p artifacts
          mvn -B -ntp verify 2>&1 | tee artifacts/java-verify.log
      - name: Go tests and static analysis
        run: |
          mkdir -p artifacts
          python3 scripts/go_tasks.py build 2>&1 | tee artifacts/go-build.log
          python3 scripts/go_tasks.py test 2>&1 | tee artifacts/go-test.log
          python3 scripts/go_tasks.py vet 2>&1 | tee artifacts/go-vet.log
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Hybrid stack and end-to-end verification
        run: |
          docker compose up --build -d --wait --wait-timeout 300
          python3 scripts/demo.py
          python3 tests/api_regression.py
          python3 tests/broker_recovery.py
      - name: Preserve runtime diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - name: Stop hybrid stack
        if: always()
        run: docker compose down -v
      - name: Baseline characterization and legacy API parity
        run: |
          docker compose -f docker-compose.yml -f compose.baseline.yml up --build -d --wait --wait-timeout 300
          BASELINE=true python3 scripts/demo.py
          BASELINE=true python3 tests/api_regression.py
      - name: Forward and reverse migration
        run: |
          docker compose -f docker-compose.yml -f compose.baseline.yml -f compose.migration.yml --profile modern up -d --wait --wait-timeout 300
          COMPOSE_PROJECT_NAME=conveyor-baseline python3 scripts/wait_quiescent.py
          python3 tests/migration_regression.py
      - name: Preserve baseline diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f docker-compose.yml -f compose.baseline.yml logs --no-color > artifacts/baseline.log 2>&1
      - name: Stop baseline stack
        if: always()
        run: docker compose -f docker-compose.yml -f compose.baseline.yml down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            artifacts/
            **/surefire-reports/
