        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/health
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped
  quality-control-service:
