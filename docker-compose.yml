name: conveyor-manufacturing
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: local-bootstrap-only
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U bootstrap -d postgres
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - /topics.sh
    volumes:
    - ./infrastructure/kafka/topics.sh:/topics.sh:ro
  legacy-monolith:
    build:
      context: .
      dockerfile: legacy-monolith/Dockerfile
    environment:
      SERVICE_NAME: legacy-monolith
      DB_URL: jdbc:postgresql://postgres:5432/legacy
      DB_USER: legacy
      DB_PASSWORD: local-development-only
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_ADDR: redis:6379
      BASELINE: 'false'
      CONSUMER_ENABLED: 'false'
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-migration-token-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped
  engineering-service:
    build:
      context: .
      dockerfile: services/engineering-service/Dockerfile
    environment:
      SERVICE_NAME: engineering-service
      DB_URL: jdbc:postgresql://postgres:5432/engineering
      DB_USER: engineering
      DB_PASSWORD: local-development-only
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_ADDR: redis:6379
      BASELINE: 'false'
      CONSUMER_ENABLED: 'true'
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-migration-token-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    ports:
    - 127.0.0.1:8081:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
